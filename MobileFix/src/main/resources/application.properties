 # Application Name
 spring.application.name=MobileFix

 # ============================================
 # H2 Database Configuration
 # ============================================
 spring.datasource.url=jdbc:h2:mem:mobilefixdb
 spring.datasource.driverClassName=org.h2.Driver
 spring.datasource.username=sa
 spring.datasource.password=

 # H2 Console (for development)
 spring.h2.console.enabled=true
 spring.h2.console.path=/h2-console
 spring.h2.console.settings.web-allow-others=false

 # ============================================
 # JPA / Hibernate Configuration
 # ============================================
 spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
 spring.jpa.hibernate.ddl-auto=create-drop
 spring.jpa.show-sql=true
 spring.jpa.properties.hibernate.format_sql=true
 spring.jpa.defer-datasource-initialization=true

 # ============================================
 # Server Configuration
 # ============================================
 server.port=8080
 server.error.include-message=always
 server.error.include-binding-errors=always

 # ============================================
 # Thymeleaf Configuration
 # ============================================
 spring.thymeleaf.cache=false
 spring.thymeleaf.prefix=classpath:/templates/
 spring.thymeleaf.suffix=.html
 spring.thymeleaf.mode=HTML
 spring.thymeleaf.encoding=UTF-8

 # ============================================
 # Logging Configuration
 # ============================================
 logging.level.root=INFO
 logging.level.com.crudzaso.MobileFix=DEBUG
 logging.level.org.springframework.web=DEBUG
 logging.level.org.hibernate.SQL=DEBUG
 logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

 # ============================================
 # Spring Security (disable default for now)
 # ============================================
 # Will configure properly in SecurityConfig later
 spring.security.user.name=admin
 spring.security.user.password=admin123